<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Territorios</title>
    <style>
      /* System font stack only — no external font loading (A6 brief DoD). */
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #ffffff;
        color: #111111;
      }

      /* High-contrast, large text for outdoor/sunlight legibility on a
         phone — A6 brief DoD "Usable on a phone, outdoors, one-handed.
         Legible contrast in sunlight." */
      h1 {
        font-size: 1.5rem;
        line-height: 1.3;
        margin: 1rem 1rem 0.25rem;
      }

      p.status {
        font-size: 1.125rem;
        font-weight: 600;
        margin: 0 1rem 1rem;
      }

      /* Large, thumb-friendly tap targets — same outdoor/one-handed
         constraint as the rest of this page (A6 brief DoD). */
      .actions {
        display: flex;
        gap: 0.75rem;
        margin: 0 1rem 0.75rem;
        flex-wrap: wrap;
      }

      .actions[hidden] {
        display: none;
      }

      .action-button {
        appearance: none;
        border: 1px solid #111111;
        border-radius: 999px;
        background: #ffffff;
        color: #111111;
        font: inherit;
        font-weight: 600;
        font-size: 1rem;
        padding: 0.75rem 1.25rem;
        min-height: 44px;
        text-decoration: none;
        cursor: pointer;
      }

      .action-button:active {
        background: #111111;
        color: #ffffff;
      }

      p.location-status {
        font-size: 1rem;
        margin: 0 1rem 1rem;
      }

      p.location-status[hidden] {
        display: none;
      }

      p.attribution {
        font-size: 0.75rem;
        color: #444444;
        margin: 0.5rem 1rem;
      }

      #map {
        width: 100%;
        height: 65vh;
        min-height: 320px;
      }

      #map[hidden] {
        display: none;
      }

      /* Map key: only the layers the territory actually draws (render.ts). */
      ul.legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        list-style: none;
        margin: 0.75rem 1rem 0;
        padding: 0;
        font-size: 1rem;
        font-weight: 600;
      }

      ul.legend[hidden] {
        display: none;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .legend-swatch {
        display: inline-block;
        width: 1.1rem;
        height: 1.1rem;
        border: 1px solid #444444;
        border-radius: 3px;
      }

      .legend-line .legend-swatch {
        height: 0.3rem;
        border: none;
      }

      .legend-point .legend-swatch {
        border-radius: 50%;
        border: 2px solid #ffffff;
        box-shadow: 0 0 0 1px #111111;
      }

      /* Pause-point marker: a dot plus an always-visible, high-contrast label. */
      .pause-point-marker {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        pointer-events: none;
      }

      .pause-point-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 3px solid #ffffff;
        box-shadow: 0 0 0 1px #111111;
      }

      .pause-point-label {
        background: #111111;
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 700;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
