services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: territorios
      POSTGRES_USER: territorios
      POSTGRES_PASSWORD: territorios
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U territorios -d territorios"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgis-data:
